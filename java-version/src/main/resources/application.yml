# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /

# OpenAI Configuration
# Replace 'your-openai-api-key-here' with your actual OpenAI API key
# Or set the OPENAI_API_KEY environment variable
openai:
  api:
    key: ${OPENAI_API_KEY:your-openai-api-key-here}
  model: gpt-3.5-turbo
  temperature: 0.7

# Database Configuration (MySQL)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/trading_game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      pool:
        size: 5

# Logging
logging:
  level:
    com.example: DEBUG
    org.springframework: INFO